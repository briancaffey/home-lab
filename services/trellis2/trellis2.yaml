# TRELLIS.2-4B image-to-3D (microsoft/TRELLIS.2-4B) on a2's RTX 4090.
#
# Moved off spark 2026-11-08: the spark build (arm64/sm_121, hostPath-mounted
# source tree) had an unresolved 10-15x perf regression and fought vLLM for
# unified memory. This is an amd64 image built from Dockerfile.4090 in
# github.com/briancaffey/Trellis2-DGX-Spark-Docker (torch 2.6/cu124, prebuilt
# flash-attn, CUDA extensions for sm_89) with the TRELLIS.2 source + FastAPI
# wrapper BAKED IN. Built on a3 (not a1) and pushed to harbor.lan/apps.
#
# NOT a3: two test generations there panic-rebooted the control plane —
# kernel BUG at fs/namei.c:934 (try_to_unlazy) on 7.0.0-42 under the
# generation's compile/IO burst. a2 runs the 6.8 kernel.
#
# GPU: claims a2's GPU EXCLUSIVELY (nvidia.com/gpu: 1) — the 1024 cascade
# needs a big chunk of 24 GB. The host-run LTX-2.5 server (ltx25-server, :8025)
# uses the same card OUTSIDE k8s, so stop one before running the other:
#   ssh a2 sudo systemctl stop ltx25-server
#   kubectl -n inference-club scale deploy trellis2 --replicas=1
# (Argo ignores /spec/replicas, so hand-scaling sticks.)
#
# Weights: a2's HF cache (~/.cache/huggingface) — TRELLIS.2-4B, the ss decoder
# from TRELLIS-image-large, and the two GATED aux models
# (facebook/dinov3-vitl16-pretrain-lvd1689m, briaai/RMBG-2.0). HF_TOKEN comes
# from Secret hf-token for any first-time download.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trellis2
  namespace: inference-club
  labels:
    app: trellis2
spec:
  replicas: 1
  strategy:
    type: Recreate # single GPU claim; old pod must release it first
  selector:
    matchLabels:
      app: trellis2
  template:
    metadata:
      labels:
        app: trellis2
    spec:
      nodeSelector:
        inference-club.com/box: a2
        kubernetes.io/arch: amd64
      runtimeClassName: nvidia
      containers:
        - name: trellis2
          image: harbor.lan/apps/trellis2:4090-8609836-r2
          imagePullPolicy: IfNotPresent
          env:
            - name: TRELLIS2_DEFAULT_VARIANT
              value: bf16
            # One resident variant on a 24 GB card; a GGUF swap would reload.
            - name: TRELLIS2_ALLOW_VARIANT_SWITCH
              value: "false"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            # opencv-python ships with EXR reading disabled; the turntable
            # `preview` format loads assets/hdri/*.exr through cv2.
            - name: OPENCV_IO_ENABLE_OPENEXR
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 40Gi
            requests:
              memory: 12Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /workspace/cache/huggingface
            # Triton + flex_gemm autotune caches survive restarts (otherwise the
            # first generation after each boot pays a ~95 s re-autotune tax).
            - name: compile-cache
              mountPath: /workspace/cache/triton
            - name: torch-cache
              mountPath: /workspace/cache/torch
          startupProbe: # pipeline load is heavy; budget generously
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
      volumes:
        - name: hf-cache
          hostPath:
            path: /home/brian/.cache/huggingface
            type: Directory
        - name: compile-cache
          hostPath:
            path: /home/brian/trellis2-cache/triton
            type: DirectoryOrCreate
        - name: torch-cache
          hostPath:
            path: /home/brian/trellis2-cache/torch
            type: DirectoryOrCreate
---
# Discovery: type=mesh routes 3D generations here (agent rewrites
# /v1/3d/generations -> POST /generate on the base URL).
apiVersion: v1
kind: Service
metadata:
  name: trellis2
  namespace: inference-club
  labels:
    inference-club.com/managed: "true"
    inference-club.com/type: mesh
    inference-club.com/engine: other
  annotations:
    inference-club.com/models: |
      - id: trellis-2
spec:
  selector:
    app: trellis2
  ports:
    - name: http
      port: 8000
      targetPort: http
