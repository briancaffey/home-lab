# NVIDIA Nemotron 3.5 Bolt 74B-A9B "24GB" — vision-language (image + video + text)
# hybrid Mamba-2 + MoE + attention, 74B total / 9B active, derived from Nemotron
# 3.5 Super VL. Experts are 2-bit (IQ2-XXS, QAD-recovered), Mamba layers NVFP4,
# so the whole model is ~24 GB — about the same footprint as Lightning, which is
# why it fits spark beside acestep / flux3-klein-nim / nemotron-asr where the
# 75 GB Super VL does not.
#
# Recipe = NVIDIA's model card, on the EXACT vLLM nightly it pins (77154ca,
# Oct 14). v0.33.0 contains that commit but segfaults in CUDA-graph replay on
# the 2nd streamed request with b12x 1.5.1 (released for that nightly) — keep
# the pin until a stable vLLM + b12x pair is verified. b12x kernels (pip +
# `vllm download-kernels` at start — needs network), V2 model runner, DFlash
# speculative decoding with the LiLiCorr drafter (7 tokens), ultra_v3 reasoning
# parser shipped in the model repo. Deviations from the card: 128K context
# (card: 256K) and no --allowed-local-media-path (images come in as data/https
# URLs, never from the pod filesystem).
#
# Weights + drafter are pre-downloaded on the spark host; HF_HUB_OFFLINE=1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-llm
spec:
  template:
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:cu129-nightly-77154ca6116ae34cbfe314beef1016bde9b63989
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: MAX_NUM_SEQS
              value: "2"
            - name: MAX_MODEL_LEN
              value: "131072"
            - name: GPU_MEM_UTIL
              value: "0.33"
          args:
            - |
              set -e
              pip install -q b12x==1.5.1
              vllm download-kernels
              SNAP=$(python3 -c "from huggingface_hub import snapshot_download as s; print(s('nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB', local_files_only=True))")
              exec vllm serve nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB \
                --served-model-name nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB nemotron-3.5-bolt \
                --trust-remote-code \
                --load-format auto \
                --tensor-parallel-size 1 \
                --port 8000 --host 0.0.0.0 \
                --max-model-len "$MAX_MODEL_LEN" \
                --max-num-seqs "$MAX_NUM_SEQS" \
                --gpu-memory-utilization "$GPU_MEM_UTIL" \
                --enable-chunked-prefill \
                --enable-prefix-caching \
                --kv-cache-dtype fp8 \
                --linear-backend b12x \
                --moe-backend b12x \
                --attention-backend FLASHINFER \
                --mamba-backend flashinfer \
                --mamba-ssm-cache-dtype bfloat16 \
                --mamba-cache-dtype bfloat16 \
                --mamba-cache-mode align \
                --seed 42 \
                --limit-mm-per-prompt '{"video":1,"image":1}' \
                --video-pruning-rate 0.5 \
                --media-io-kwargs '{"video":{"fps":2,"num_frames":256}}' \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --reasoning-parser-plugin "$SNAP/ultra_v3_reasoning_parser.py" \
                --reasoning-parser ultra_v3 \
                --speculative-config '{"method":"dflash","model":"nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr","num_speculative_tokens":7,"rejection_sample_method":"standard","attention_backend":"FLASHINFER","draft_load_config":{"load_format":"auto"}}'
