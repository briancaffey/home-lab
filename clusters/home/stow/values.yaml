# Stow environment overlay for the home cluster. Chart defaults live with the
# app: forgejo.lan/brian/stow -> chart/values.yaml. Only what differs belongs
# here.
#
# Secrets come from Vaultwarden item `stow-stow-secrets` via External Secrets
# (stow repo: deploy/bootstrap-secrets.sh). Nothing sensitive goes in this file.

image:
  # CI writes this line on every push to stow main (12-char commit SHA).
  # Do not edit by hand: the next build overwrites it.
  tag: "8c40911506d5"

secrets:
  create: false
externalSecret:
  enabled: true

# Postgres and the photo store are local-path volumes, so everything shares
# one node. a2 has the disk and trusts Harbor. When a2 is booted into Windows,
# Stow is down with it.
nodeSelector:
  kubernetes.io/arch: amd64
  inference-club.com/box: a2

ingress:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Stow"
    gethomepage.dev/description: "Everything you own, and where it is"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "mdi-package-variant-closed"
    gethomepage.dev/href: "https://stow.lan"

admin:
  email: brian@stow.lan
  name: Brian
  householdName: Home

# Every model call goes through Inference Club (club.lan), under Stow's own
# club account (stow@club.lan), so its requests are recorded there and kept
# apart from everyone else's. The token is the vault item's AI_API_KEY and
# IMAGE_API_KEY fields.
#   vision: the club has no local vision model (the spark-llm slot runs the
#     text-only Nemotron Lightning), so it passes these calls to NVIDIA's API
#     with the NVIDIA key saved on the stow account. Each captured photo
#     therefore still goes to NVIDIA. To keep photos in-house, load a local
#     vision model and change `model` to its club id.
#   image: FLUX 3 Klein on the cluster, for sample data now and outfits later.
inference:
  clubCollection: stow
  vision:
    baseUrl: http://backend.inference-club-web.svc.cluster.local:8001/v1
    hostHeader: club.lan
    model: "nvidia:nvidia/nemotron-3.5-bolt-e4b"
  image:
    baseUrl: http://backend.inference-club-web.svc.cluster.local:8001/v1
    hostHeader: club.lan
    model: flux-3-image-klein-fp8
