# Kernel module loads, on every node.
#
# Why here: a loaded module is the end of every other control on that node,
# and this fleet has had kernel trouble worth correlating against (a3's
# 6.17 lockup, docs/22; blade booting 7.0.0-42 without its NVIDIA module).
# NVIDIA/Longhorn modules load at boot before the agent starts, so steady
# state should be nearly silent.
#
# Verbatim from upstream (cilium/tetragon v1.8.0,
# examples/policylibrary/modules.yaml) apart from this header.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "monitor-kernel-modules"
  annotations:
    description: "Monitor kernel modules operations"
spec:
  kprobes:
  - call: "security_kernel_module_request"
    message: "Kernel module requested and is being loaded automatically"
    syscall: false
    return: true
    args:
    - index: 0
      type: "string"
    returnArg:
      index: 0
      type: "int"
  - call: "security_kernel_read_file"
    message: "Kernel module is being loaded"
    # Explicit module loading using file descriptor finit_module() to print module full path
    syscall: false
    return: true
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Equal"
        values:
        - "2"  # READING_MODULE
