# Tetragon — eBPF runtime security observability + enforcement.
# Report: docs/23-tetragon-runtime-security.html · runbook: ./README.md
#
# One agent pod per node (DaemonSet) + one small operator Deployment.
# Works with k3s's default flannel CNI — Cilium is NOT required.

# CRDs ship as plain chart templates so Argo applies CRD + TracingPolicy in
# one sync (chart default "operator" registers them at runtime, which races
# the policies/ resources on first sync).
crds:
  installMethod: helm

tetragon:
  # Sets cluster_name on every event — handy once events leave the cluster.
  clusterName: home

  # Starting point, not a measured number: watch
  # container_memory_working_set_bytes for a week and adjust. The BPF maps
  # themselves are kernel memory and are NOT counted against this limit.
  resources:
    requests: { cpu: 50m, memory: 200Mi }
    limits: { memory: 1Gi }

  # Capabilities + Linux namespaces on exec events. OFF after the first hour
  # live (2026-11-24): with both on, an exec event was ~9.5 KB (two 1.4 KB
  # capability sets and two namespace blocks, once for the process and once
  # for its parent) and the cluster projected ~17 GB/day into a 10Gi Loki.
  # Turn one on for a day when you want to answer "what runs with
  # CAP_SYS_ADMIN / in the host PID namespace" (audit L1), then off again.
  enableProcessCred: false
  enableProcessNs: false

  # ---- What gets written to stdout -> promtail -> Loki --------------------
  # An event is exported if it matches ANY allow line and NO deny line.
  # Fields inside one line are ANDed.
  #
  # PROCESS_EXIT is left out on purpose: it doubles volume, and Loki has a
  # 10Gi PVC. Add it back if you want exit codes / process lifetimes.
  exportAllowList: |-
    {"event_set":["PROCESS_EXEC", "PROCESS_KPROBE", "PROCESS_UPROBE", "PROCESS_TRACEPOINT", "PROCESS_LSM"]}
  # namespace "" = processes that are not in a pod (the host). Host exec
  # noise (systemd, cron, k3s, containerd shims) is dropped, but host events
  # from TracingPolicies (file / module / k3s-secret hooks) still export.
  exportDenyList: |-
    {"health_check":true}
    {"namespace":[""], "event_set":["PROCESS_EXEC"]}
    {"namespace":["tetragon"]}
    {"binary_regex":["^/proc/self/fd/[0-9]+$"]}
    {"namespace":["netdata"], "binary_regex":["/usr/sbin/tc$", "/usr/sbin/netdatacli$"]}
    {"namespace":["monitoring"], "binary_regex":["/usr/bin/nvidia-smi$"]}
    {"namespace":["longhorn-system"], "pod_regex":["^engine-image-"]}
  # Lines 4-7 are measured noise from the first hour (events/min, cluster):
  #   /proc/self/fd/N  runc's re-exec on every exec probe; the real binary
  #                    that follows is still exported
  #   netdata tc       226  per-interface qdisc polling
  #   nvidia-smi        86  vram-reporter's sampling loop
  #   longhorn engine  160  engine-image readiness probes (sh + longhorn)
  # Re-measure after adding services:
  #   topk(20, sum by (namespace, workload, binary) (rate(tetragon_events_total{event_type="PROCESS_EXEC"}[5m])) * 60)

  # The parent block repeats the pod identity already on the process; drop
  # it from the export. Parent binary, arguments and exec_id are kept.
  fieldFilters: |-
    {"fields":"parent.pod,parent.docker", "action":"EXCLUDE"}

  # Secrets end up in argv all the time. Mask the obvious shapes before the
  # event leaves the node. Extend as you spot leaks in Loki.
  redactionFilters: |-
    {"redact": ["(?:--password|--token|--secret|--api-key)(?:\\s+|=)(\\S*)"]}
    {"redact": ["(?i)authorization:\\s*bearer\\s+(\\S*)"]}

  prometheus:
    enabled: true
    port: 2112
    # Default is namespace,workload,pod,binary. Dropping `pod` keeps series
    # count sane on a hand-rolled Prometheus with 5s scrapes elsewhere.
    metricsLabelFilter: "namespace,workload,binary"
    serviceMonitor:
      enabled: false   # no Prometheus Operator here — static scrape instead

tetragonOperator:
  # amd64 + always-on. Not spark (arm64, often offline) or the laptops.
  nodeSelector:
    inference-club.com/box: a2
  prometheus:
    enabled: false
