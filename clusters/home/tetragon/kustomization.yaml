apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tetragon

# Tetragon — eBPF runtime security (report: docs/23, runbook: ./README.md).
# Helm-inflating dir, rendered by Argo via --enable-helm. Local render:
#   kustomize build --enable-helm clusters/home/tetragon
resources:
  - namespace.yaml
  # Phase 2 (detect): uncomment AFTER the agent has run clean for a few days.
  # - policies

helmCharts:
  - name: tetragon
    repo: https://helm.cilium.io
    version: 1.8.0
    releaseName: tetragon
    namespace: tetragon
    valuesFile: values.yaml
