apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vaultwarden, kind: ClusterSecretStore }
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-server-key
      remoteRef: { key: hermes-hermes-secrets, property: api-server-key }
    - secretKey: dashboard-password
      remoteRef: { key: hermes-hermes-secrets, property: dashboard-password }
    - secretKey: dashboard-session-secret
      remoteRef: { key: hermes-hermes-secrets, property: dashboard-session-secret }
    - secretKey: litellm-api-key
      remoteRef: { key: hermes-hermes-secrets, property: litellm-api-key }
    - secretKey: wandb-api-key
      remoteRef: { key: hermes-hermes-secrets, property: wandb-api-key }
    # hermes-otel backend credentials (observability/*): pulled from the same
    # Vaultwarden items the backends use, so there is one source of truth.
    - secretKey: langfuse-public-key
      remoteRef: { key: hermes-langfuse-keys, property: public-key }
    - secretKey: langfuse-secret-key
      remoteRef: { key: hermes-langfuse-keys, property: secret-key }
    - secretKey: openobserve-password
      remoteRef: { key: observability-openobserve-root, property: ZO_ROOT_USER_PASSWORD }
    - secretKey: parseable-basic-auth
      remoteRef: { key: observability-parseable-env-secret, property: basic_auth_b64 }
    - secretKey: uptrace-dsn
      remoteRef: { key: observability-uptrace-secrets, property: UPTRACE_DSN }
