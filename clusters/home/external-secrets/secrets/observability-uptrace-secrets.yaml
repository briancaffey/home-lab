apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptrace-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vaultwarden, kind: ClusterSecretStore }
  target:
    name: uptrace-secrets
    creationPolicy: Owner
  data:
    - secretKey: UPTRACE_SECRET
      remoteRef: { key: observability-uptrace-secrets, property: UPTRACE_SECRET }
    - secretKey: UPTRACE_ADMIN_PASSWORD
      remoteRef: { key: observability-uptrace-secrets, property: UPTRACE_ADMIN_PASSWORD }
    - secretKey: UPTRACE_USER_TOKEN
      remoteRef: { key: observability-uptrace-secrets, property: UPTRACE_USER_TOKEN }
    - secretKey: UPTRACE_PROJECT_TOKEN
      remoteRef: { key: observability-uptrace-secrets, property: UPTRACE_PROJECT_TOKEN }
    - secretKey: CH_PASSWORD
      remoteRef: { key: observability-uptrace-secrets, property: CH_PASSWORD }
    - secretKey: PG_PASSWORD
      remoteRef: { key: observability-uptrace-secrets, property: PG_PASSWORD }
    # Composed http://<project token>@uptrace.observability.svc.cluster.local:80?grpc=4317
    # (Uptrace self-monitoring, and mirrored into hermes-secrets/uptrace-dsn)
    - secretKey: UPTRACE_DSN
      remoteRef: { key: observability-uptrace-secrets, property: UPTRACE_DSN }
