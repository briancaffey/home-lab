# The ACTIVE hermes-otel plugin configuration — this is the file that decides
# where Hermes agent traces go. It is the *plugin's own* config.yaml, which is
# SEPARATE from Hermes's main config.yaml (clusters/home/hermes/configmap.yaml →
# /opt/data/config.yaml), where the plugin is only *enabled*
# (plugins: enabled: [hermes_otel]).
#
# The hermes-otel plugin reads this from ~/.hermes/plugins/hermes_otel/config.yaml.
# We set HOME=/opt/data (deployment.yaml) so that path is /opt/data/.hermes/...
# on the PVC, and an initContainer (install-hermes-otel) copies THIS file there
# on every boot — so editing this file + restarting the pod is all it takes.
# This mirrors the hermes-otel repo's own config.yaml format, so the same file
# works whether you run the plugin standalone or here.
#
# SAFE FOR THE PUBLIC REPO — NO SECRETS. `*_env` fields and `${VAR}` references
# name environment variables; the values live in the `hermes-secrets` Secret
# (ESO ← Vaultwarden). The W&B entity/project are public identifiers.
#
# Every entry below gets its own export queue (non-blocking fan-out), so a
# backend that is scaled down or uninstalled only costs a few dropped-batch
# log lines — comment it out here to stop sending to it. Per-backend notes and
# UI links: observability/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-otel-config
data:
  config.yaml: |
    project_name: hermes-agent
    # Python logs → the log-capable backends (OpenObserve, SigNoz, Uptrace,
    # Parseable); trace-id correlated.
    capture_logs: true
    backends:
      # ── cloud ──────────────────────────────────────────────────────────
      # W&B Weave (W&B Cloud). API key from WANDB_API_KEY (hermes-secrets).
      - type: weave
        api_key_env: WANDB_API_KEY
        entity: briancaffey-united-states-of-america
        project: hermes-agent

      # ── in-cluster (observability/<name>) ─────────────────────────────
      # Arize Phoenix — traces. https://phoenix.lan
      - type: phoenix
        endpoint: http://phoenix-svc.observability.svc.cluster.local:6006/v1/traces
      # Langfuse v4 — traces. https://langfuse.lan (project keys in hermes-secrets)
      - type: langfuse
        endpoint: http://langfuse-web.observability.svc.cluster.local:3000
        public_key_env: LANGFUSE_PUBLIC_KEY
        secret_key_env: LANGFUSE_SECRET_KEY
      # OpenObserve — traces + metrics + logs. https://openobserve.lan
      - type: openobserve
        endpoint: http://openobserve-openobserve-standalone.observability.svc.cluster.local:5080/api/default/v1/traces
        user: admin@openobserve.lan
        password_env: OPENOBSERVE_PASSWORD
        metrics: true
      # Jaeger v2 — traces. https://jaeger.lan
      - type: jaeger
        endpoint: http://jaeger.observability.svc.cluster.local:4318/v1/traces
      # Grafana Tempo — traces. Grafana Explore → Tempo (https://grafana.lan)
      - type: tempo
        endpoint: http://tempo.observability.svc.cluster.local:4318/v1/traces
      # "LGTM" — OTel Collector gateway → Tempo (traces) + Prometheus (metrics).
      - type: lgtm
        endpoint: http://lgtm.observability.svc.cluster.local:4318/v1/traces
        metrics: true
      # SigNoz — traces + metrics + logs. https://signoz.lan
      - type: signoz
        endpoint: http://signoz-otel-collector.observability.svc.cluster.local:4318/v1/traces
        metrics: true
        metrics_temporality: delta
      # Uptrace — traces + metrics + logs. https://uptrace.lan (DSN in hermes-secrets)
      - type: uptrace
        endpoint: http://uptrace.observability.svc.cluster.local:80/v1/traces
        dsn_env: UPTRACE_DSN
        metrics: true
        metrics_temporality: delta
      # Parseable OSS — one generic entry per signal with Basic auth, because
      # `type: parseable` only speaks X-API-Key and Parseable OSS has no API
      # keys (observability/parseable/README.md). https://parseable.lan
      - type: otlp
        name: parseable-traces
        endpoint: http://parseable-standalone-service.observability.svc.cluster.local:80/v1/traces
        headers:
          Authorization: "Basic ${PARSEABLE_BASIC_AUTH}"
          X-P-Stream: hermes-traces
          X-P-Log-Source: otel-traces
        metrics: false
        logs: false
      - type: otlp
        name: parseable-metrics
        endpoint: http://parseable-standalone-service.observability.svc.cluster.local:80/v1/traces
        headers:
          Authorization: "Basic ${PARSEABLE_BASIC_AUTH}"
          X-P-Stream: hermes-metrics
          X-P-Log-Source: otel-metrics
        traces: false
        metrics: true
        logs: false
      - type: otlp
        name: parseable-logs
        endpoint: http://parseable-standalone-service.observability.svc.cluster.local:80/v1/traces
        headers:
          Authorization: "Basic ${PARSEABLE_BASIC_AUTH}"
          X-P-Stream: hermes-logs
          X-P-Log-Source: otel-logs
        traces: false
        metrics: false
        logs: true
