# hn.fm environment overlay for the home cluster. Chart defaults live with the
# app: github.com/briancaffey/hn.fm → charts/hnfm/values.yaml. Only what
# differs from those defaults belongs here.
#
# Secrets come from Vaultwarden item `hnfm-hnfm-secrets` via External Secrets
# (one custom field per key). Nothing sensitive goes in this file.

image:
  # CI writes this line on every push to hn.fm main (12-char commit SHA).
  # Do not edit by hand — the next build overwrites it.
  tag: 816628088848

secrets:
  create: false
externalSecret:
  enabled: true

# Everything shares one node (local-path outputs volume). a2 has the disk.
nodeSelector:
  kubernetes.io/arch: amd64
  inference-club.com/box: a2

# LLM goes through LiteLLM in-cluster as route `nemotron-lightning` (chart
# default): Nemotron 3.5 Lightning on vLLM on the spark box. The earlier
# route, `spark-omni` (LM Studio), stopped answering in November 2026.
# To bypass the gateway during an outage the model must switch to the id the
# server itself reports:
#   inference:
#     llm:
#       baseUrl: http://192.168.6.19:1234/v1
#       model: nvidia/nemotron-3-nano-omni
#       triageModel: nvidia/nemotron-3-nano-omni
#       visionModel: nvidia/nemotron-3-nano-omni

features:
  video: true
  music: false          # acestep is parked at 0 replicas
  hyperframes: true
  metaSequencer: true
  schedule: true        # beat: fetch /new + /top, digests to Kindle, one video per 6h

# HNFM on air: the radio station (hn.fm issue #37). Stream at /radio/hnfm.mp3,
# page at /listen, control room at /radio. It makes new programming only
# while someone is tuned in, plus three editions a day; otherwise it plays
# from its own library. Needs no secret of its own.
radio:
  enabled: true

flower:
  enabled: true         # https://hnfm.lan/flower
