apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: GET
      timeInterval: 5s
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
  # Grafana Tempo (observability/tempo) — traces from hermes-otel (type: tempo)
  # and from the lgtm collector gateway (type: lgtm). Query API :3200.
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo.observability.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
      serviceMap:
        datasourceUid: prometheus
