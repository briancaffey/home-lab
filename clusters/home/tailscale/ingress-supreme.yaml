# https://supreme.<tailnet>.ts.net  ->  Supreme Opinions
# One backend: the web pod forwards /api/* to the API itself, so there are no
# path rules to mirror. The app is hostname-agnostic (same-origin API calls,
# media served through the API) and has its own login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supreme-ts
  namespace: supreme-opinions
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - supreme
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supreme-web
                port:
                  number: 3000
