# https://hermes.<tailnet>.ts.net  ->  Hermes DASHBOARD (:9119), all paths
# For the Hermes iOS app: it connects to the dashboard (not the :8642 gateway
# API — pointing it there gives "not the Hermes dashboard (HTTP 404)"). Sign in
# with Password = dashboard basic auth (user brian, Vaultwarden
# hermes-dashboard-password). The dashboard drives agent runs: tailnet-only,
# never enable Funnel on this. (After changing the backend port, delete the
# ts-hermes-ts-* proxy pod — it doesn't pick up the change on its own.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ts
  namespace: hermes
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hermes
      port:
        number: 9119
  tls:
    - hosts:
        - hermes
