# https://langfuse.<tailnet>.ts.net  ->  langfuse-web:3000 (Langfuse UI)
# Tailnet-only LLM tracing UI. The operator spins up a proxy device named
# "langfuse" and serves it with a Let's Encrypt cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse-ts
  namespace: observability
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: langfuse-web
      port:
        number: 3000
  tls:
    - hosts:
        - langfuse
