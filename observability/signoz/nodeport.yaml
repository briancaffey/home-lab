# NodePort twin of the chart's ClusterIP service, so hermes-otel on the LAN can
# reach SigNoz (UI and query API) by node IP and port over plain HTTP (no mkcert TLS, no .lan
# DNS). Reachable on any node, e.g. a3 (192.168.5.173). Same pattern as the
# *-direct services (immich, jellyfin, navidrome).
apiVersion: v1
kind: Service
metadata:
  name: signoz-direct
  namespace: observability
  labels: { app.kubernetes.io/part-of: hermes-otel-direct }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: signoz
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/name: signoz
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30880 }
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-collector-direct
  namespace: observability
  labels: { app.kubernetes.io/part-of: hermes-otel-direct }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/name: signoz
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http, nodePort: 30434 }
