# NodePort twin of the chart's ClusterIP service, so hermes-otel on the LAN can
# reach the LGTM collector gateway (OTLP/HTTP) by node IP and port over plain HTTP (no mkcert TLS, no .lan
# DNS). Reachable on any node, e.g. a3 (192.168.5.173). Same pattern as the
# *-direct services (immich, jellyfin, navidrome).
apiVersion: v1
kind: Service
metadata:
  name: lgtm-direct
  namespace: observability
  labels: { app.kubernetes.io/part-of: hermes-otel-direct }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: lgtm
    app.kubernetes.io/name: opentelemetry-collector
    component: standalone-collector
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318, nodePort: 30433 }
