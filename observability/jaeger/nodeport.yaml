# NodePort twin of the chart's ClusterIP service, so hermes-otel on the LAN can
# reach Jaeger (OTLP/HTTP receiver, query API and UI) by node IP and port over plain HTTP (no mkcert TLS, no .lan
# DNS). Reachable on any node, e.g. a3 (192.168.5.173). Same pattern as the
# *-direct services (immich, jellyfin, navidrome).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-direct
  namespace: observability
  labels: { app.kubernetes.io/part-of: hermes-otel-direct }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: all-in-one
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318, nodePort: 30431 }
    - { name: http-query, port: 16686, targetPort: 16686, nodePort: 31686 }
