# NodePort twin of the chart's ClusterIP service, so hermes-otel on the LAN can
# reach Tempo (OTLP/HTTP receiver and query API) by node IP and port over plain HTTP (no mkcert TLS, no .lan
# DNS). Reachable on any node, e.g. a3 (192.168.5.173). Same pattern as the
# *-direct services (immich, jellyfin, navidrome).
apiVersion: v1
kind: Service
metadata:
  name: tempo-direct
  namespace: observability
  labels: { app.kubernetes.io/part-of: hermes-otel-direct }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: tempo
    app.kubernetes.io/name: tempo
  ports:
    - { name: tempo-otlp-http, port: 4318, targetPort: 4318, nodePort: 30432 }
    - { name: tempo-prom-metrics, port: 3200, targetPort: 3200, nodePort: 30320 }
