# https://tempo.lan/v1/{traces,metrics,logs}  ->  tempo:4318 (OTLP/HTTP receiver)
# https://tempo.lan/api/…                    ->  tempo:3200 (Tempo query API, read path)
# No UI here — this host exists so exporters on the LAN (the laptop Hermes)
# can reach the receiver; the UI is Grafana. TLS via the mkcert secret
# `tempo-tls` (scripts/lan-certs.sh). Not Homepage-discovered on purpose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo
  namespace: observability
spec:
  ingressClassName: traefik
  rules:
    - host: tempo.lan
      http:
        paths:
          # OTLP/HTTP receiver: POST /v1/{traces,metrics,logs}
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 4318
          # Everything else is Tempo's query API (/api/search, /api/traces/…)
          # so hermes-otel's dashboard adapter can read back through this host.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 3200
  tls:
    - secretName: tempo-tls
      hosts:
        - tempo.lan
