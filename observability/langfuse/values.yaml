# Langfuse — self-hosted LLM engineering platform (traces, prompts, evals), via
# the OFFICIAL Helm chart (https://langfuse.github.io/langfuse-k8s, chart 2.1.1,
# app 4.35). Managed as a Helm release (NOT kustomize), like phoenix. Deploy:
#
#   kubectl -n observability create secret generic langfuse-secrets ...   # see README
#   kubectl apply -f observability/langfuse/clickhouse.yaml
#   helm upgrade --install langfuse langfuse/langfuse --version 2.1.1 \
#     -n observability -f observability/langfuse/values.yaml
#   kubectl apply -f observability/langfuse/ingress-lan.yaml
#   kubectl apply -k clusters/home/tailscale                # ingress-langfuse.yaml
#
# Layout: web (langfuse-web:3000) + worker Deployments, bundled Postgres
# (groundhog2k), Valkey (redis) and SeaweedFS (S3, all-in-one) subcharts, and a
# SELF-MANAGED single-node ClickHouse (clickhouse.yaml): the chart's own
# ClickHouse path needs the upstream ClickHouse operator + a Keeper cluster,
# which is a lot of alpha machinery for one box. Everything stateful is pinned
# to a3 on local-path PVCs.
#
# Secrets live ONLY in the in-cluster Secret `langfuse-secrets` (public repo).

fullnameOverride: langfuse

langfuse:
  nodeSelector:
    inference-club.com/box: a3
  # Pin the app secrets to our Secret instead of letting the chart generate
  # them (keeps API-key hashes / encrypted data stable across reinstalls).
  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryption-key
  nextauth:
    url: https://langfuse.lan
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauth-secret
  # Exposed via our own Traefik (.lan) + Tailscale ingresses.
  ingress:
    enabled: false
  # The web pod runs every Prisma migration before it serves /api/public/health.
  # A fresh database means 400+ migrations, several minutes on a3; the chart's
  # default liveness (20s + 3x10s) killed the container mid-migration and left
  # a half-applied row that blocked every later start (P3009). Give it 10 min.
  web:
    livenessProbe:
      initialDelaySeconds: 600
      periodSeconds: 10
      failureThreshold: 6
  worker:
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 6
  features:
    # Don't phone home to Langfuse analytics.
    telemetryEnabled: false
  additionalEnv:
    # Headless bootstrap on FIRST start only: an org, a project and a login,
    # plus the project's API keys (what hermes-otel / the dashboard use).
    # All values come from the Secret; see README for how to read them back.
    - name: LANGFUSE_INIT_ORG_ID
      value: home
    - name: LANGFUSE_INIT_ORG_NAME
      value: Home
    - name: LANGFUSE_INIT_PROJECT_ID
      value: hermes-otel
    - name: LANGFUSE_INIT_PROJECT_NAME
      value: hermes-otel
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: init-project-public-key
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: init-project-secret-key
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: init-user-email
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: init-user-password
    - name: LANGFUSE_INIT_USER_NAME
      value: Brian

postgresql:
  deploy: true
  # Credentials are chart-managed: generated in-cluster as
  # `langfuse-postgresql-auth` on first install (never committed). Pointing
  # the sub-chart at our own Secret needs five extra keys in the sub-chart's
  # own layout; not worth it for one box.
  nodeSelector:
    inference-club.com/box: a3
  storage:
    requestedSize: 10Gi

redis:
  deploy: true
  nodeSelector:
    inference-club.com/box: a3

# Self-managed ClickHouse (see clickhouse.yaml). Single node, no cluster DDL.
clickhouse:
  deploy: false
  crdCheck: false
  host: langfuse-clickhouse
  auth:
    username: clickhouse
    existingSecret: langfuse-secrets
    existingSecretKey: clickhouse-password
  migration:
    url: clickhouse://langfuse-clickhouse:9000
    autoMigrate: true
  cluster:
    enabled: false

# Bundled SeaweedFS in all-in-one mode for event / media uploads. Pinned to a3
# like the other stores (the subchart takes nodeSelector as a multi-line
# string); unpinned it landed on spark, which is often offline, and every
# trace ingest goes through this bucket.
s3:
  deploy: true
  allInOne:
    nodeSelector: |
      inference-club.com/box: a3
