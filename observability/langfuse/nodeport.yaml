# NodePort twin of the chart's ClusterIP service, so hermes-otel on the LAN can
# reach Langfuse (UI, public API and /api/public/otel) by node IP and port over plain HTTP (no mkcert TLS, no .lan
# DNS). Reachable on any node, e.g. a3 (192.168.5.173). Same pattern as the
# *-direct services (immich, jellyfin, navidrome).
apiVersion: v1
kind: Service
metadata:
  name: langfuse-direct
  namespace: observability
  labels: { app.kubernetes.io/part-of: hermes-otel-direct }
spec:
  type: NodePort
  selector:
    app: web
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/name: langfuse
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30300 }
